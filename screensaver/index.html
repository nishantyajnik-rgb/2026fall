
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishant's Animated Screensaver</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="screen" tabindex="0" aria-label="Animated screensaver. Hover over or focus this area to start the movement.">
        <div class="stars" aria-hidden="true"></div>

        <div class="orbit orbit-outer" aria-hidden="true">
            <div class="planet blue"></div>
        </div>

        <div class="orbit orbit-middle" aria-hidden="true">
            <div class="planet pink"></div>
        </div>

        <div class="orbit orbit-inner" aria-hidden="true">
            <div class="planet amber"></div>
        </div>

        <div class="sun" aria-hidden="true"></div>

        <p class="hint">Hover or click to activate</p>
    </main>
</body>
</html>
